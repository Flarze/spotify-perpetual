[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-perpetual"
version = "1.0.0"
description = "Keep Spotify playing: poll playback, launch Spotify and start a playlist when idle."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "spotipy",
    "python-dotenv",
    "psutil",
    "PyYAML",
]

[project.scripts]
idle-player = "idle_player.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]
tray = ["pystray", "Pillow"]
build = ["pyinstaller"]
# Local playback status via Windows SMTC (mode=hybrid). Windows-only.
# winrt-* are the maintained bindings (wheels for current Pythons incl. 3.13+);
# all pull in winrt-runtime. Foundation is required to await the WinRT async
# ops; Foundation.Collections to iterate the session list. On Python <=3.12 the
# older single-package "winsdk" also works - status.py imports whichever exists.
smtc = [
    "winrt-Windows.Media.Control; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
]
