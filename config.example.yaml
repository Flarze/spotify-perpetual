# Optional config. Copy to config.yaml (gitignored) to configure the app.
#
# config.yaml is auto-loaded when it sits next to your .env. It can either
# override individual .env values or hold the entire configuration on its own
# (credentials included) — useful as a single file a setup wizard can write.
# YAML keys take precedence over .env. Leave a key out to keep the .env value
# (or the built-in default).
#
# config.yaml is a SECRET if it holds credentials — it is gitignored. Never
# commit it.

# Spotify app credentials (https://developer.spotify.com/dashboard).
# Omit these to keep using the values from .env instead.
client_id: ""
client_secret: ""
redirect_uri: "http://127.0.0.1:8888/callback"

# Playlists to keep alive. One, or several separated by commas. Accepts
# spotify:playlist:... URIs or open.spotify.com links.
playlists: ""                # e.g. "spotify:playlist:aaaa, spotify:playlist:bbbb"

playlist_selection: rotate   # with several: rotate (cycle in order) | random
shuffle: false               # shuffle the playlist when starting
repeat: "off"                # off | context (loop the playlist) | track (loop one song)

# volume: 60                 # 0-100; leave unset to keep the device's volume
fade_in_seconds: 0           # >0 ramps volume from 0 up to target on start/resume

poll_interval: 30            # seconds between playback checks
token_cache_path: .cache     # where the OAuth token cache is stored (SECRET)

# Treat paused-but-loaded as "listening" (don't restart playback).
# false = pausing also triggers the app.
paused_counts_as_playing: true

# When the app acts on a paused track (paused_counts_as_playing: false), resume
# that same track instead of starting a fresh playlist. No effect when
# paused_counts_as_playing is true.
resume_paused_track: false

device:
  preferred_name: ""         # optional: prefer this Connect device by name
  launch_wait_seconds: 8     # wait after launching Spotify before retry

# On repeated API/network failures, wait longer between retries instead of
# hammering every poll_interval. Resets to normal cadence on recovery.
backoff:
  factor: 2                  # each consecutive failure multiplies the delay
  max_seconds: 600           # cap the backoff delay

# Wait for the network at startup (autostart at login can beat the network up).
network:
  wait_attempts: 12          # how many times to probe before giving up
  wait_interval: 5           # seconds between probes
  probe_timeout: 3           # per-probe TCP connect timeout

logging:
  level: INFO
  file: logs/idle_player.log
  max_bytes: 1048576         # rotate at ~1 MB
  backup_count: 3
